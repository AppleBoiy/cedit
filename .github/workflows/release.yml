name: Release

# Push a tag like "v1.0.0" to build cedit.app on macOS and attach it to a
# new GitHub Release as a zip. See README.txt's RELEASING section.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # macos-latest usually ships lz4 already, but make it explicit
      # rather than relying on the runner image's default toolset -
      # needed for games/bbee.py's tests and for the app itself.
      - name: Ensure lz4 is installed
        run: brew list lz4 &>/dev/null || brew install lz4

      - name: Install runtime + build requirements
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements.txt

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build cedit.app
        run: pyinstaller packaging/cedit.spec --noconfirm

      - name: Build cedit-cli
        run: pyinstaller packaging/cedit_cli.spec --noconfirm

      - name: Zip cedit.app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent cedit.app cedit-macos.zip

      - name: Zip cedit-cli
        # dist/cedit-cli is a folder (onedir build, not onefile - see
        # packaging/cedit_cli.spec's comment for why), so this needs -r to
        # recurse into it, not -j (which is for flattening single files).
        run: |
          cd dist
          zip -r cedit-cli-macos.zip cedit-cli

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cedit-macos.zip
            dist/cedit-cli-macos.zip
          generate_release_notes: true
