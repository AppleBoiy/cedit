name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Config lives in pyproject.toml. This only checks (no --fix / no
      # `ruff format`) - formatting the whole tree is a separate, deliberate
      # decision (`make format` shows the diff without writing anything).
      - name: Run ruff
        run: ruff check .

  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Needed for games/bbee.py's tests (lib/bbee_lib.py shells out to
      # the real lz4 CLI rather than reimplementing LZ4 framing) - those
      # tests skip themselves automatically wherever this isn't installed,
      # but ubuntu-latest doesn't ship it by default, so install it here
      # to actually exercise them in CI instead of silently skipping.
      - name: Install lz4
        run: sudo apt-get update && sudo apt-get install -y lz4

      # pycryptodome (Crypto.Cipher) is needed by games/mhw.py/lib/mhw_crypto.py,
      # and the lz4 *Python package* (a separate thing from the lz4 CLI above)
      # by lib/hades_lib.py - both are imported at module load time, so
      # test_mhw/test_hades fail to even import without these. Deliberately
      # NOT installing requirements.txt wholesale here: that would also pull
      # in PySide6, defeating tests.test_cli's own
      # test_games_package_does_not_require_pyside6, which exists to prove
      # `import games` works with no GUI toolkit installed at all.
      - name: Install pycryptodome and lz4 (Python packages)
        run: pip install pycryptodome lz4

      # Only lib/base.py, lib/dredge_client.py, lib/octopath_lib.py,
      # lib/bbee_lib.py, lib/hades_lib.py, lib/mhw_crypto.py, games/octopath.py,
      # games/dave.py, games/bbee.py, games/duckov.py, games/hades.py,
      # games/hades2.py, games/mhw.py, and cli.py are covered here - they're
      # pure Python with no PySide6/display dependency (this runner has no
      # PySide6 installed at all, and tests.test_cli's own
      # test_games_package_does_not_require_pyside6 actively asserts that
      # `import games` stays that way). cedit.py and games/dredge_window.py
      # and games/hades_window.py and games/mhw_window.py (the PySide6 UI)
      # have no automated coverage: a GUI test would need a real (or virtual)
      # display, which is a bigger lift than this workflow's scope - see
      # README.txt's TESTS section.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
