name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Needed for games/bbee.py's tests (lib/bbee_lib.py shells out to
      # the real lz4 CLI rather than reimplementing LZ4 framing) - those
      # tests skip themselves automatically wherever this isn't installed,
      # but ubuntu-latest doesn't ship it by default, so install it here
      # to actually exercise them in CI instead of silently skipping.
      - name: Install lz4
        run: sudo apt-get update && sudo apt-get install -y lz4

      # Only lib/base.py, lib/dredge_client.py, lib/octopath_lib.py,
      # lib/bbee_lib.py, and games/octopath.py, games/dave.py, games/bbee.py
      # are covered here - they're pure Python with no PySide6/display
      # dependency. cedit.py and games/dredge.py (the PySide6 UI) have no
      # automated coverage: a GUI test would need a real (or virtual)
      # display, which is a bigger lift than this workflow's scope - see
      # README.txt's TESTS section.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
